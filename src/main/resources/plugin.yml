name: FastBrewing
version: 1.0.0
main: com.lunatech.fastbrewing.FastBrewingPlugin
api-version: '1.20'
author: lunarenzo
folia-supported: true
description: Standalone Paper plugin for high-performance fast brewing.

commands:
  fastbrewing:
    description: Reload FastBrewing plugin configuration
    permission: fastbrewing.admin
    usage: /<command> reload

permissions:
  fastbrewing.admin:
    description: Permission to reload FastBrewing
    default: op
